spring:
  application:
    name: shopfind-backend

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/shopfind
    username: postgres
    password: postgres
    pool:
      initial-size: 10
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/shopfind
    user: postgres
    password: postgres
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: on_param

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.shopfind: DEBUG
    org.springframework.r2dbc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/shopfind_dev

  flyway:
    url: jdbc:postgresql://localhost:5432/shopfind_dev

server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: prod

  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/shopfind}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/shopfind}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    com.shopfind: INFO
